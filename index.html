<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>启·系列2026田径系列收藏卡</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #4a148c 0%, #6a1b9a 50%, #8e24aa 100%);
            color: #e3f2fd;
            line-height: 1.6;
        }
        header {
            background: rgba(255,255,255,0.08);
            padding: 32px 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 10;
            text-align: center;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 32px 16px;
            max-width: 720px;
            margin: 0 auto;
        }
        .item {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }
        .item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }
        .img-wrap {
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .item img {
            width: 100%;
            display: block;
        }
        .caption {
            padding: 12px 16px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .num { font-weight: 600; color: #90caf9; }
        .name { color: #666; font-size: 12px; word-break: break-all; }
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }
        .lightbox.active { display: flex; }
        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
        }
        .nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 32px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .nav:hover { background: rgba(255,255,255,0.25); }
        .nav.prev { left: 24px; }
        .nav.next { right: 24px; }
        .counter {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 6px 14px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>启·系列2026田径系列收藏卡</h1>
    </header>

    <div class="gallery" id="gallery"></div>

    <div class="lightbox" id="lightbox">
        <button class="nav prev" id="prevBtn">&lsaquo;</button>
        <img id="lightboxImg" src="" alt="">
        <button class="nav next" id="nextBtn">&rsaquo;</button>
        <div class="counter" id="counter"></div>
    </div>

    <script>
        const images = [
            { num: 1,  name: '1.jpg'  },
            { num: 2,  name: '2.gif'  },
            { num: 3,  name: '3.gif'  },
            { num: 4,  name: '4.gif'  },
            { num: 5,  name: '5.gif'  },
            { num: 6,  name: '6.gif'  },
            { num: 7,  name: '7.gif'  },
            { num: 8,  name: '8.gif'  },
            { num: 9,  name: '9.gif'  },
            { num: 10, name: '10.gif' },
            { num: 11, name: '11.gif' },
            { num: 12, name: '12.jpg' },
            { num: 13, name: '13.jpg' },
            { num: 14, name: '14.jpg' },
            { num: 15, name: '15.jpg' },
            { num: 16, name: '16.jpg' },
            { num: 17, name: '17.jpg' },
            { num: 18, name: '18.jpg' },
            { num: 19, name: '19.jpg' },
            { num: 20, name: '20.jpg' },
            { num: 21, name: '21.jpg' },
            { num: 22, name: '22.jpg' },
            { num: 23, name: '23.jpg' },
            { num: 24, name: '24.jpg' }
        ];

        const gallery = document.getElementById('gallery');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const counter = document.getElementById('counter');
        let current = 0;

        images.forEach((img, idx) => {
            const item = document.createElement('div');
            item.className = 'item';
            item.innerHTML = `
                <div class="img-wrap">
                    <img src="publicImage/${img.name}" alt="${img.name}" loading="lazy">
                </div>
                <div class="caption">
                    <span class="num">#${img.num}</span>
                    <span class="name">${img.name}</span>
                </div>
            `;
            item.addEventListener('click', () => openLightbox(idx));
            gallery.appendChild(item);
        });

        function openLightbox(idx) {
            current = idx;
            showImage();
            lightbox.classList.add('active');
        }

        function showImage() {
            lightboxImg.src = `publicImage/${images[current].name}`;
            counter.textContent = `${current + 1} / ${images.length}`;
        }

        function closeLightbox() { lightbox.classList.remove('active'); }
        function prev() { current = (current - 1 + images.length) % images.length; showImage(); }
        function next() { current = (current + 1) % images.length; showImage(); }

        document.getElementById('prevBtn').addEventListener('click', (e) => { e.stopPropagation(); prev(); });
        document.getElementById('nextBtn').addEventListener('click', (e) => { e.stopPropagation(); next(); });
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') prev();
            if (e.key === 'ArrowRight') next();
        });
    </script>
</body>
</html>
